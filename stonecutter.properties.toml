# Mod metadata and, per build, the Minecraft versions it runs on and the dependencies it builds against.
# The launcher reads this file too, to know which jar goes with which Minecraft version.
mod.id = "lucentclient"
mod.version = "0.1.0"

deps.fabric_loader = "0.19.5"
loomx.loom_version = "1.18.2"

["26.1.2"]
mod.mc_compat = ">=26.1 <26.2"
mod.mc_releases = ["26.1", "26.1.1", "26.1.2"]
deps.fabric_api = "0.155.3+26.1.2"

["26.2"]
mod.mc_compat = "~26.2"
mod.mc_releases = ["26.2"]
deps.fabric_api = "0.161.0+26.2"

["26.3"]
mod.mc_compat = "~26.3"
mod.mc_releases = ["26.3"]
deps.fabric_api = "0.161.0+26.3"
